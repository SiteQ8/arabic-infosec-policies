<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e1a"/>
      <stop offset="100%" style="stop-color:#111827"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#d4a843"/>
      <stop offset="100%" style="stop-color:#f0d078"/>
    </linearGradient>
    <linearGradient id="cyan-gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#06b6d4"/>
      <stop offset="100%" style="stop-color:#d4a843"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="spot1" cx="20%" cy="30%" r="40%">
      <stop offset="0%" style="stop-color:rgba(6,182,212,0.08)"/>
      <stop offset="100%" style="stop-color:transparent"/>
    </radialGradient>
    <radialGradient id="spot2" cx="80%" cy="60%" r="35%">
      <stop offset="0%" style="stop-color:rgba(212,168,67,0.06)"/>
      <stop offset="100%" style="stop-color:transparent"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="700" fill="url(#bg)"/>
  <rect width="1200" height="700" fill="url(#spot1)"/>
  <rect width="1200" height="700" fill="url(#spot2)"/>

  <!-- Grid lines -->
  <g stroke="rgba(6,182,212,0.04)" stroke-width="0.5">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
    <line x1="0" y1="660" x2="1200" y2="660"/>
    <line x1="60" y1="0" x2="60" y2="700"/>
    <line x1="120" y1="0" x2="120" y2="700"/>
    <line x1="180" y1="0" x2="180" y2="700"/>
    <line x1="240" y1="0" x2="240" y2="700"/>
    <line x1="300" y1="0" x2="300" y2="700"/>
    <line x1="360" y1="0" x2="360" y2="700"/>
    <line x1="420" y1="0" x2="420" y2="700"/>
    <line x1="480" y1="0" x2="480" y2="700"/>
    <line x1="540" y1="0" x2="540" y2="700"/>
    <line x1="600" y1="0" x2="600" y2="700"/>
    <line x1="660" y1="0" x2="660" y2="700"/>
    <line x1="720" y1="0" x2="720" y2="700"/>
    <line x1="780" y1="0" x2="780" y2="700"/>
    <line x1="840" y1="0" x2="840" y2="700"/>
    <line x1="900" y1="0" x2="900" y2="700"/>
    <line x1="960" y1="0" x2="960" y2="700"/>
    <line x1="1020" y1="0" x2="1020" y2="700"/>
    <line x1="1080" y1="0" x2="1080" y2="700"/>
    <line x1="1140" y1="0" x2="1140" y2="700"/>
  </g>

  <!-- Navbar -->
  <rect x="0" y="0" width="1200" height="62" fill="rgba(10,14,26,0.95)" stroke="rgba(212,168,67,0.15)" stroke-width="0.5"/>
  <!-- Shield icon -->
  <path d="M40 12 L28 18 V28 C28 36 33 41 40 44 C47 41 52 36 52 28 V18 Z" fill="none" stroke="#d4a843" stroke-width="1.5"/>
  <path d="M36 28 L39 31 L45 25" fill="none" stroke="#d4a843" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="60" y="30" font-family="Cairo, Arial" font-size="14" font-weight="800" fill="#d4a843">سياسات أمن المعلومات</text>
  <text x="60" y="45" font-family="Cairo, Arial" font-size="9" fill="#64748b">Arabic InfoSec Policies</text>

  <!-- Nav links -->
  <text x="1150" y="35" font-family="Cairo, Arial" font-size="12" fill="#94a3b8" text-anchor="end">GitHub</text>
  <text x="1070" y="35" font-family="Cairo, Arial" font-size="12" fill="#94a3b8" text-anchor="end">البدء السريع</text>
  <text x="980" y="35" font-family="Cairo, Arial" font-size="12" fill="#94a3b8" text-anchor="end">الأمثلة</text>
  <text x="910" y="35" font-family="Cairo, Arial" font-size="12" fill="#94a3b8" text-anchor="end">الامتثال</text>
  <text x="840" y="35" font-family="Cairo, Arial" font-size="12" fill="#d4a843" text-anchor="end">السياسات</text>

  <!-- Version Badge -->
  <rect x="480" y="140" width="240" height="32" rx="16" fill="rgba(6,182,212,0.1)" stroke="rgba(6,182,212,0.25)" stroke-width="1"/>
  <circle cx="690" cy="156" r="4" fill="#10b981"/>
  <text x="600" y="161" font-family="Cairo, Arial" font-size="12" fill="#06b6d4" text-anchor="middle">الإصدار 2.0 — مارس 2026</text>

  <!-- Main Heading -->
  <text x="600" y="230" font-family="Cairo, Arial" font-size="48" font-weight="900" fill="url(#gold)" text-anchor="middle" filter="url(#glow)">سياسات أمن المعلومات</text>
  <text x="600" y="290" font-family="Cairo, Arial" font-size="42" font-weight="900" fill="#f1f5f9" text-anchor="middle">الأولى من نوعها بالعربية</text>

  <!-- Description -->
  <text x="600" y="340" font-family="Tajawal, Arial" font-size="16" fill="#94a3b8" text-anchor="middle">أكبر مجموعة مفتوحة المصدر من سياسات وأطر أمن المعلومات باللغة العربية</text>
  <text x="600" y="365" font-family="Tajawal, Arial" font-size="16" fill="#94a3b8" text-anchor="middle">متوافقة مع أحدث المعايير العالمية وجاهزة للتطبيق في مؤسستك فوراً</text>

  <!-- Buttons -->
  <rect x="400" y="400" width="200" height="48" rx="12" fill="url(#gold)"/>
  <text x="500" y="430" font-family="Cairo, Arial" font-size="14" font-weight="700" fill="#0a0e1a" text-anchor="middle">استعرض السياسات</text>

  <rect x="620" y="400" width="200" height="48" rx="12" fill="none" stroke="rgba(212,168,67,0.2)" stroke-width="1"/>
  <text x="720" y="430" font-family="Cairo, Arial" font-size="14" font-weight="700" fill="#f1f5f9" text-anchor="middle">دليل البدء السريع</text>

  <!-- Stats -->
  <g transform="translate(0, 490)">
    <!-- Stat 1 -->
    <text x="200" y="30" font-family="Cairo, Arial" font-size="36" font-weight="900" fill="#d4a843" text-anchor="middle">4</text>
    <text x="200" y="55" font-family="Tajawal, Arial" font-size="12" fill="#64748b" text-anchor="middle">سياسات أساسية</text>

    <!-- Stat 2 -->
    <text x="430" y="30" font-family="Cairo, Arial" font-size="36" font-weight="900" fill="#d4a843" text-anchor="middle">+8</text>
    <text x="430" y="55" font-family="Tajawal, Arial" font-size="12" fill="#64748b" text-anchor="middle">معايير مدعومة</text>

    <!-- Stat 3 -->
    <text x="660" y="30" font-family="Cairo, Arial" font-size="36" font-weight="900" fill="#d4a843" text-anchor="middle">3</text>
    <text x="660" y="55" font-family="Tajawal, Arial" font-size="12" fill="#64748b" text-anchor="middle">أمثلة قطاعية</text>

    <!-- Stat 4 -->
    <text x="890" y="30" font-family="Cairo, Arial" font-size="36" font-weight="900" fill="#d4a843" text-anchor="middle">+5</text>
    <text x="890" y="55" font-family="Tajawal, Arial" font-size="12" fill="#64748b" text-anchor="middle">قوالب جاهزة</text>
  </g>

  <!-- Standards ribbon -->
  <rect x="0" y="610" width="1200" height="90" fill="rgba(17,24,39,0.8)" stroke="rgba(212,168,67,0.15)" stroke-width="0.5"/>
  <text x="100" y="660" font-family="Cairo, Arial" font-size="11" fill="#64748b" text-anchor="middle">🏛️ ISO 27001</text>
  <text x="240" y="660" font-family="Cairo, Arial" font-size="11" fill="#64748b" text-anchor="middle">🔒 NIST CSF 2.0</text>
  <text x="380" y="660" font-family="Cairo, Arial" font-size="11" fill="#64748b" text-anchor="middle">🛡️ CIS Controls</text>
  <text x="520" y="660" font-family="Cairo, Arial" font-size="11" fill="#64748b" text-anchor="middle">⚡ Zero Trust</text>
  <text x="660" y="660" font-family="Cairo, Arial" font-size="11" fill="#64748b" text-anchor="middle">🤖 AI Governance</text>
  <text x="810" y="660" font-family="Cairo, Arial" font-size="11" fill="#64748b" text-anchor="middle">🏦 بنك الكويت المركزي</text>
  <text x="960" y="660" font-family="Cairo, Arial" font-size="11" fill="#64748b" text-anchor="middle">💳 PCI DSS</text>
  <text x="1100" y="660" font-family="Cairo, Arial" font-size="11" fill="#64748b" text-anchor="middle">🌐 SWIFT CSP</text>
</svg>
